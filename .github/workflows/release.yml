name: release

# Build the Luma Key FFGL plugin for the two platforms Resolume runs on:
#   - macOS  -> universal (arm64 + x86_64) LumaKey.bundle
#   - Windows -> x64 LumaKey.dll (GLEW static-linked via vcpkg)
# Each ships as a zip; drop the bundle/dll into Resolume's "Extra Effects"
# folder. Trigger manually (Actions > release > Run workflow) or by pushing a
# v* tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-universal, os: macos-14,       artifact: LumaKey.bundle }
          - { name: windows-x86_64,  os: windows-latest, artifact: LumaKey.dll }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- macOS: no extra deps, universal build straight from CMake ---
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # --- Windows: GLEW comes from vcpkg, static-linked (static-md keeps the
      #     CRT dynamic so the plugin matches the host) so the .dll has no
      #     external glew32.dll runtime dependency. ---
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "build/LumaKey.bundle" "out/LumaKey.bundle"
            # Sanity-check the bundle really is universal and exports plugMain.
            lipo -archs "out/LumaKey.bundle/Contents/MacOS/LumaKey"
            nm -gU "out/LumaKey.bundle/Contents/MacOS/LumaKey" | grep -q "_plugMain"
          else
            cp "build/Release/LumaKey.dll" "out/LumaKey.dll"
          fi
          # OpenFX build: shipped as its own zip, not folded into the FFGL
          # artefact — it installs to the OFX folder, not Resolume's.
          mkdir -p ofxout
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "build/LumaKey.ofx.bundle" "ofxout/LumaKey.ofx.bundle"
            lipo -archs "ofxout/LumaKey.ofx.bundle/Contents/MacOS/LumaKey.ofx"
            nm -gU "ofxout/LumaKey.ofx.bundle/Contents/MacOS/LumaKey.ofx" | grep "_OfxGetPlugin" >/dev/null
            codesign --force --sign - --timestamp=none "ofxout/LumaKey.ofx.bundle"
          else
            mkdir -p "ofxout/LumaKey.ofx.bundle/Contents/Win64"
            cp "build/LumaKey.ofx.bundle/Contents/Win64/LumaKey.ofx" "ofxout/LumaKey.ofx.bundle/Contents/Win64/LumaKey.ofx"
          fi
          # Adobe (After Effects / Premiere) build: Rust on the
          # after-effects crate, no Adobe SDK involved. Ships as its own zip;
          # one install into the shared MediaCore folder serves both hosts.
          mkdir -p adobeout
          if [ "${{ runner.os }}" = "macOS" ]; then
            ( cd adobe && ./bundle.sh release )
            cp -R "adobe/target/release/LumaKey.plugin" "adobeout/LumaKey.plugin"
            lipo -archs "adobeout/LumaKey.plugin/Contents/MacOS/LumaKey"
            nm -gU "adobeout/LumaKey.plugin/Contents/MacOS/LumaKey" | grep "_EffectMain" >/dev/null
          else
            ( cd adobe && cargo build --release )
            cp "adobe/target/release/lumakey_adobe.dll" "adobeout/LumaKey.aex"
          fi
          ls -R adobeout
          ls -R ofxout
          ls -R out

      - name: Archive (zip)
        shell: bash
        run: |
          cd out
          if command -v 7z >/dev/null 2>&1; then
            7z a "../luma-key-${{ matrix.name }}.zip" ./*
          else
            zip -r "../luma-key-${{ matrix.name }}.zip" ./*
          fi
          cd ../ofxout
          if command -v 7z >/dev/null 2>&1; then
            7z a "../luma-key-ofx-${{ matrix.name }}.zip" ./*
          else
            zip -r "../luma-key-ofx-${{ matrix.name }}.zip" ./*
          fi
          cd ../adobeout
          if command -v 7z >/dev/null 2>&1; then
            7z a "../luma-key-adobe-${{ matrix.name }}.zip" ./*
          else
            zip -r "../luma-key-adobe-${{ matrix.name }}.zip" ./*
          fi

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # A .dmg, but deliberately NOT a .pkg. An FFGL plugin's destination is
        # per-user and edition-specific — the README installs to
        # ~/Documents/Resolume {Arena,Avenue}/Extra Effects — so a .pkg would
        # have to guess a path and would silently install to the wrong one for
        # half of users. Mounting an image and dragging the bundle where the
        # README says is the honest shape here.
        run: |
          source scripts/release-lib.sh
          rl_init "Luma Key" luma-key "${{ steps.ver.outputs.version }}" \
            com.stoatworks.luma-key "$GITHUB_WORKSPACE"
          cp README.md out/ 2>/dev/null || true
          rl_adhoc_sign "out/LumaKey.bundle"
          rl_dmg "${{ matrix.name }}" out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luma-key-${{ matrix.name }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so the installer is wrapped here from the zip the
    # Windows job uploaded. Its directory page defaults to the common FFGL
    # folder but stays editable, because Resolume reads plugins from a path the
    # user chooses per edition.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0" ;; esac
          rl_init "Luma Key" luma-key "$version" com.stoatworks.luma-key "$PWD/installers"
          zip="$(find artifacts -name "luma-key-windows-x86_64.zip" | head -1)"
          if [ -z "$zip" ]; then echo "no Windows artefact, nothing to do"; exit 0; fi
          stage="$RUNNER_TEMP/stage-win"
          rm -rf "$stage"; mkdir -p "$stage"
          unzip -q "$zip" -d "$stage"
          cp README.md "$stage/" 2>/dev/null || true
          # --cli: a plugin has no executable to make a shortcut to.
          rl_nsis windows-x86_64 "$stage" --cli
          ls -l installers

      - uses: actions/upload-artifact@v4
        with:
          name: luma-key-windows-installer
          path: installers/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
