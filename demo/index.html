        <h1>Luma Key</h1>
        <p>
          A luminance keyer for Resolume Arena and Avenue as FFGL, for Resolve,
          Vegas, Nuke and Natron as OpenFX, and for After Effects and Premiere
          Pro. It comes as macOS universal and Windows x64, plus a Linux OpenFX
          build.
        </p>
        <p>

          <a href="https://stoatworks-labs.com/software/resolume-luma-keyer/">its project page</a>.
        </p>
